[project]
name = "coverage-rag"
version = "0.1.0"
description = "Cited Q&A over US Medicare coverage policy and Indian health insurance rules. Azure OpenAI + Azure AI Search, with a local mode."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pypdf>=4.2",
  "rank-bm25>=0.2.2",
  "numpy>=1.26",
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  "azure-search-documents>=11.5",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["coverage_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
